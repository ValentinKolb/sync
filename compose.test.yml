services:
  valkey:
    image: docker.io/valkey/valkey:8-alpine
    container_name: sync_test_valkey
    command: valkey-server --save "" --appendonly no
    ports:
      - "6399:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - valkey-cli SET sync:test:sentinel k2b-sync-test-v1 >/dev/null && valkey-cli GET sync:test:sentinel | grep -qx k2b-sync-test-v1
      interval: 2s
      timeout: 2s
      retries: 10
