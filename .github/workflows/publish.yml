name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "sync-v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Start three-node NATS cluster
        run: docker compose -f compose.nats.yml up -d --wait
      - name: Typecheck
        run: bun run typecheck
      - name: Script tests
        run: bun test scripts/*.test.ts
      - name: Cluster tests
        run: cd packages/sync && bun run test
      - name: Serial fault tests
        run: cd packages/sync && bun run test:serial

  publish-sync:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/sync-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm 11.5.1+
        run: npm install -g npm@11.5.1

      - name: Set version from tag
        run: cd packages/sync && npm version ${GITHUB_REF#refs/tags/sync-v} --no-git-tag-version --allow-same-version

      - name: Build bundles
        run: bun build ./packages/sync/index.ts ./packages/sync/retry.ts --outdir ./packages/sync/dist --target bun --packages external

      - name: Generate type declarations
        run: bunx tsc --project packages/sync/tsconfig.json --declaration --emitDeclarationOnly --noEmit false --outDir packages/sync/dist

      - name: Finalize ESM imports
        run: node scripts/rewrite-esm-imports.mjs packages/sync/dist

      - name: Create dist package.json
        run: |
          node -e '
            const fs = require("fs");
            const src = JSON.parse(fs.readFileSync("packages/sync/package.json", "utf8"));
            const dist = {
              name: src.name,
              version: src.version,
              description: src.description,
              main: "index.js",
              module: "index.js",
              types: "index.d.ts",
              type: "module",
              exports: {
                ".": { types: "./index.d.ts", import: "./index.js" },
                "./retry": { types: "./retry.d.ts", import: "./retry.js" },
              },
              dependencies: src.dependencies,
              keywords: ["bun", "nats", "jetstream", "queue", "topic", "jobs", "scheduler", "mutex", "ephemeral", "object-store", "distributed"],
              author: "Valentin Kolb",
              license: "MIT",
              repository: { type: "git", url: "git+https://github.com/k2b-dev/sync.git" },
            };
            fs.writeFileSync("packages/sync/dist/package.json", JSON.stringify(dist, null, 2) + "\n");
          '

      - name: Copy package docs
        run: |
          cp README.md packages/sync/dist/README.md
          cp MIGRATION.md packages/sync/dist/MIGRATION.md
          cp LICENSE packages/sync/dist/LICENSE

      - name: Verify packed consumer
        run: |
          PACKAGE_TGZ=$(npm pack --silent)
          tar -tzf "$PACKAGE_TGZ" | grep -qx "package/MIGRATION.md"
          PACKAGE_PATH="$GITHUB_WORKSPACE/packages/sync/dist/$PACKAGE_TGZ"
          CONSUMER_DIR=$(mktemp -d)
          cd "$CONSUMER_DIR"
          npm init -y >/dev/null
          npm install "$PACKAGE_PATH" >/dev/null
          cat > index.mjs <<'EOF'
          import { createSync, retry, ResourceDriftError } from "@k2b/sync";
          import { retry as retryOnly, expBackoff } from "@k2b/sync/retry";
          if (typeof createSync !== "function" || typeof retry !== "function" || typeof retryOnly !== "function" || typeof expBackoff !== "function") {
            throw new Error("packed runtime exports are incomplete");
          }
          if (typeof ResourceDriftError !== "function") throw new Error("packed error exports are incomplete");
          EOF
          bun index.mjs
          test -f node_modules/@k2b/sync/MIGRATION.md
          cat > index.ts <<'EOF'
          import { createSync } from "@k2b/sync";
          import type { JobConfig, QueueConfig, Sync, SyncConfig, TopicConfig, ObjectRef, PumpConfig, ScheduleContext } from "@k2b/sync";
          import type { RetryConfig } from "@k2b/sync/retry";
          declare const config: SyncConfig;
          const sync: Sync = createSync(config);
          declare const queueConfig: QueueConfig;
          declare const jobConfig: JobConfig;
          declare const topicConfig: TopicConfig;
          declare const pumpConfig: PumpConfig<{ id: string }, string, { key: string }>;
          declare const ref: ObjectRef;
          declare const ctx: ScheduleContext;
          declare const retryConfig: RetryConfig<number>;
          void [sync.queue(queueConfig), sync.job(jobConfig), sync.topic(topicConfig), sync.pump(pumpConfig), ref, ctx, retryConfig];
          EOF
          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "target": "ESNext",
              "strict": true,
              "noEmit": true
            },
            "include": ["index.ts"]
          }
          EOF
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --project tsconfig.json
          rm "$PACKAGE_PATH"
        working-directory: ./packages/sync/dist

      - name: Publish @k2b/sync
        run: npm publish --provenance --access public
        working-directory: ./packages/sync/dist
