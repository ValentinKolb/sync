name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: docker.io/valkey/valkey:8-alpine
        ports:
          - 6399:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6399
        run: bun test

  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Run browser tests
        run: bun run test:browser

  publish-npm:
    needs: [test, test-browser]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm 11.5.1+
        run: npm install -g npm@11.5.1

      - name: Verify npm version
        run: npm --version

      - name: Set version from tag
        run: npm version ${GITHUB_REF#refs/tags/v} --no-git-tag-version --allow-same-version

      - name: Build server bundle
        run: bun build ./index.ts --outdir ./dist --target bun

      - name: Build browser modules
        run: |
          mkdir -p dist/browser
          bun build ./src/browser/index.ts --outdir ./dist/browser --target browser
          # Build individual modules for tree-shaking subpath imports
          for mod in ratelimit mutex queue topic job scheduler ephemeral registry retry store; do
            bun build ./src/browser/${mod}.ts --outdir ./dist/browser --target browser
          done

      - name: Create dist package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat > dist/package.json << EOF
          {
            "name": "@valentinkolb/sync",
            "version": "$VERSION",
            "description": "Synchronization primitives for TypeScript — server (Redis) and browser (in-memory)",
            "main": "index.js",
            "module": "index.js",
            "types": "index.d.ts",
            "type": "module",
            "sideEffects": false,
            "exports": {
              ".": {
                "import": "./index.js",
                "types": "./index.d.ts"
              },
              "./browser": {
                "import": "./browser/index.js",
                "types": "./browser/index.d.ts"
              },
              "./browser/ratelimit": { "import": "./browser/ratelimit.js", "types": "./browser/ratelimit.d.ts" },
              "./browser/mutex": { "import": "./browser/mutex.js", "types": "./browser/mutex.d.ts" },
              "./browser/queue": { "import": "./browser/queue.js", "types": "./browser/queue.d.ts" },
              "./browser/topic": { "import": "./browser/topic.js", "types": "./browser/topic.d.ts" },
              "./browser/job": { "import": "./browser/job.js", "types": "./browser/job.d.ts" },
              "./browser/scheduler": { "import": "./browser/scheduler.js", "types": "./browser/scheduler.d.ts" },
              "./browser/ephemeral": { "import": "./browser/ephemeral.js", "types": "./browser/ephemeral.d.ts" },
              "./browser/registry": { "import": "./browser/registry.js", "types": "./browser/registry.d.ts" },
              "./browser/retry": { "import": "./browser/retry.js", "types": "./browser/retry.d.ts" },
              "./browser/store": { "import": "./browser/store.js", "types": "./browser/store.d.ts" }
            },
            "peerDependencies": {
              "zod": "^4"
            },
            "keywords": ["bun", "redis", "ratelimit", "mutex", "jobs", "queue", "distributed", "browser", "local-first"],
            "author": "Valentin Kolb",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/ValentinKolb/sync.git"
            }
          }
          EOF

      - name: Copy package docs
        run: |
          cp README.md dist/README.md
          cp LICENSE dist/LICENSE

      - name: Generate type declarations
        run: bunx tsc --declaration --emitDeclarationOnly --noEmit false --outDir dist

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: ./dist
