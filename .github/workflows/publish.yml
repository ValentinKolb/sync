name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: docker.io/valkey/valkey:8-alpine
        ports:
          - 6399:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6399
        run: bun test

  publish-npm:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm 11.5.1+
        run: npm install -g npm@11.5.1

      - name: Verify npm version
        run: npm --version

      - name: Set version from tag
        run: npm version ${GITHUB_REF#refs/tags/v} --no-git-tag-version

      - name: Build package
        run: bun build ./index.ts --outdir ./dist --target bun

      - name: Create dist package.json
        run: |
          # Get version from package.json
          VERSION=$(node -p "require('./package.json').version")

          # Create package.json for dist with lowercase name for npm
          cat > dist/package.json << EOF
          {
            "name": "@valentinkolb/sync",
            "version": "$VERSION",
            "description": "Distributed synchronization primitives for Bun and TypeScript",
            "main": "index.js",
            "module": "index.js",
            "types": "index.d.ts",
            "type": "module",
            "exports": {
              ".": {
                "import": "./index.js",
                "types": "./index.d.ts"
              }
            },
            "peerDependencies": {
              "zod": "^4"
            },
            "keywords": ["bun", "redis", "ratelimit", "mutex", "jobs", "queue", "distributed"],
            "author": "Valentin Kolb",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/ValentinKolb/sync.git"
            }
          }
          EOF

      - name: Generate type declarations
        run: bunx tsc --declaration --emitDeclarationOnly --outDir dist

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: ./dist
