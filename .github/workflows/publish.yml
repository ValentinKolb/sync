name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "sync-v*"
  pull_request:

jobs:
  test-server:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: docker.io/valkey/valkey:8-alpine
        ports:
          - 6399:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Run server tests
        env:
          REDIS_URL: redis://localhost:6399
        run: cd packages/sync && bun test --preload ./tests/preload.ts

  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Run browser tests
        run: cd packages/sync-browser && bun test tests/*.test.ts

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Typecheck + parity
        run: bun run typecheck

  publish-sync:
    needs: [test-server, test-browser, parity]
    if: startsWith(github.ref, 'refs/tags/sync-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm 11.5.1+
        run: npm install -g npm@11.5.1

      - name: Set version from tag
        run: cd packages/sync && npm version ${GITHUB_REF#refs/tags/sync-v} --no-git-tag-version --allow-same-version

      - name: Build server bundle
        run: bun build ./packages/sync/index.ts --outdir ./packages/sync/dist --target bun

      - name: Build browser modules
        run: |
          # Use tsc to preserve the browser module graph, then add .js extensions
          # so @k2b/sync/browser works in standard ESM resolution.
          bunx tsc --project packages/sync-browser/tsconfig.json \
            --declaration \
            --noEmit false \
            --outDir packages/sync/dist/browser \
            --verbatimModuleSyntax false \
            --allowImportingTsExtensions false \
            --module ESNext
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from "node:fs/promises";
          import { join } from "node:path";

          async function walk(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              const path = join(dir, entry.name);
              if (entry.isDirectory()) {
                await walk(path);
              } else if (entry.isFile() && path.endsWith(".js")) {
                let text = await readFile(path, "utf8");
                text = text.replace(
                  /(from\s+["'])(\.{1,2}\/[^"']+?)(["'])/g,
                  (match, prefix, spec, suffix) =>
                    /\.[cm]?js$|\.json$/.test(spec) ? match : `${prefix}${spec}.js${suffix}`,
                );
                await writeFile(path, text);
              }
            }
          }

          await walk("packages/sync/dist/browser");
          NODE

      - name: Create dist package.json
        run: |
          VERSION=$(node -p "require('./packages/sync/package.json').version")
          cat > packages/sync/dist/package.json << EOF
          {
            "name": "@k2b/sync",
            "version": "$VERSION",
            "description": "Distributed sync primitives for TypeScript and Bun — ratelimit, mutex, queue, topic, job, scheduler, ephemeral, retry",
            "main": "index.js",
            "module": "index.js",
            "types": "index.d.ts",
            "type": "module",
            "exports": {
              ".": {
                "import": "./index.js",
                "types": "./index.d.ts"
              },
              "./browser": {
                "import": "./browser/index.js",
                "types": "./browser/index.d.ts"
              }
            },
            "keywords": ["bun", "redis", "valkey", "ratelimit", "mutex", "jobs", "queue", "topic", "scheduler", "ephemeral", "distributed"],
            "author": "Valentin Kolb",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/k2b-dev/sync.git"
            }
          }
          EOF

      - name: Copy package docs
        run: |
          cp README.md packages/sync/dist/README.md
          cp LICENSE packages/sync/dist/LICENSE

      - name: Generate type declarations
        run: bunx tsc --project packages/sync/tsconfig.json --declaration --emitDeclarationOnly --noEmit false --outDir packages/sync/dist

      - name: Publish @k2b/sync
        run: npm publish --provenance --access public
        working-directory: ./packages/sync/dist
