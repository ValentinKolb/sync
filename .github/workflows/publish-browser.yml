name: Publish Browser

on:
  push:
    tags:
      - "browser-v*"

jobs:
  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Run browser tests
        run: cd packages/sync-browser && bun test tests/*.test.ts

  publish:
    needs: test-browser
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm 11.5.1+
        run: npm install -g npm@11.5.1

      - name: Set version from tag
        run: cd packages/sync-browser && npm version ${GITHUB_REF#refs/tags/browser-v} --no-git-tag-version --allow-same-version

      - name: Build browser modules
        run: |
          # Use tsc to preserve re-export structure (not bun build which bundles)
          bunx tsc --project packages/sync-browser/tsconfig.json \
            --declaration \
            --noEmit false \
            --outDir packages/sync-browser/dist \
            --verbatimModuleSyntax false \
            --allowImportingTsExtensions false \
            --module ESNext

      - name: Create dist package.json
        run: |
          VERSION=$(node -p "require('./packages/sync-browser/package.json').version")
          cat > packages/sync-browser/dist/package.json << EOF
          {
            "name": "@valentinkolb/sync-browser",
            "version": "$VERSION",
            "description": "Browser-compatible sync primitives — in-memory ratelimit, mutex, queue, topic, job, scheduler, ephemeral, retry",
            "main": "index.js",
            "module": "index.js",
            "types": "index.d.ts",
            "type": "module",
            "sideEffects": false,
            "exports": {
              ".": { "import": "./index.js", "types": "./index.d.ts" },
              "./ratelimit": { "import": "./src/ratelimit.js", "types": "./src/ratelimit.d.ts" },
              "./mutex": { "import": "./src/mutex.js", "types": "./src/mutex.d.ts" },
              "./queue": { "import": "./src/queue.js", "types": "./src/queue.d.ts" },
              "./topic": { "import": "./src/topic.js", "types": "./src/topic.d.ts" },
              "./job": { "import": "./src/job.js", "types": "./src/job.d.ts" },
              "./scheduler": { "import": "./src/scheduler.js", "types": "./src/scheduler.d.ts" },
              "./scheduler-control": { "import": "./src/scheduler-control.js", "types": "./src/scheduler-control.d.ts" },
              "./ephemeral": { "import": "./src/ephemeral.js", "types": "./src/ephemeral.d.ts" },
              "./retry": { "import": "./src/retry.js", "types": "./src/retry.d.ts" },
              "./store": { "import": "./src/store.js", "types": "./src/store.d.ts" }
            },
            "keywords": ["browser", "local-first", "ratelimit", "mutex", "queue", "topic", "scheduler", "ephemeral", "in-memory"],
            "author": "Valentin Kolb",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/ValentinKolb/sync.git"
            }
          }
          EOF

      - name: Copy package docs
        run: |
          cp README.md packages/sync-browser/dist/README.md
          cp LICENSE packages/sync-browser/dist/LICENSE

      - name: Publish @valentinkolb/sync-browser
        run: npm publish --provenance --access public
        working-directory: ./packages/sync-browser/dist
